indices:
  english: &default
    include:
      - /**
    exclude:
      - '**/fragments/**'
      - '**/drafts/**'
      - '/**/*.json'
    target: /query-index.json
    properties:
      image:
        select: meta[property="og:image"]
        value: |
          attribute(el, 'content')
      title:
        select: meta[property="og:title"]
        value: |
          attribute(el, "content")
      description:
        select: meta[property="og:description"]
        value: |
          attribute(el, "content")
  french:
    <<: *default
    include:
      - /fr/**
    exclude:
      - /fr/snippets/**
    target: /fr/query-index.json